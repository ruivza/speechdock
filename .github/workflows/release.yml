# Modified by ruivza: build on GitHub; sign, notarize, and publish on a local Mac.
name: Build Release Artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: speechdock-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Tracked files match the allow list
        run: ruby scripts/lint/check_tracked_paths.rb

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.0'

      - name: Validate version and tag
        id: version
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || {
            echo "::error::The tag must match VERSION."
            exit 1
          }
          ruby -ryaml -e 'v = File.read("VERSION").strip; p = YAML.load_file("project.yml"); abort "Target versions must match VERSION" unless %w[SpeechDock SpeechDockVoiceInput].all? { |t| s = p.fetch("targets").fetch(t).fetch("settings").fetch("base"); s.fetch("MARKETING_VERSION") == v && s.fetch("CURRENT_PROJECT_VERSION") == v }'
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned universal app
        run: bash scripts/build.sh --unsigned

      - name: Upload unsigned build for local signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SpeechDock-${{ steps.version.outputs.VERSION }}-unsigned
          path: build/SpeechDock-${{ steps.version.outputs.VERSION }}-unsigned.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Explain local release step
        run: |
          {
            echo 'The artifact is unsigned and is intended for the maintainer.'
            echo 'On your Mac, check out this tag and run:'
            echo '```bash'
            echo "NOTARY_PROFILE=speechdock-release bash scripts/release-local.sh --run $GITHUB_RUN_ID --publish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
