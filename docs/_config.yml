# SpeechDock GitHub Pages Configuration
# https://ruivza.github.io/speechdock/

title: SpeechDock
description: SpeechDock 独立维护分支的使用、权限、隐私与发布指南

# GitHub Pages URL settings
url: https://ruivza.github.io
baseurl: /speechdock
repository: ruivza/speechdock

# Theme
remote_theme: just-the-docs/just-the-docs@v0.4.2

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Logo
logo: /images/icon.png

# Color scheme (light or dark)
color_scheme: light

# Enable search
search_enabled: true

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/ruivza/speechdock"
  "原项目":
    - "https://github.com/yohasebe/speechdock"

aux_links_new_tab: true

# Markdown engine
markdown: kramdown
kramdown:
  input: GFM

# Files to exclude
exclude:
  - _config.yml.bak
  - Gemfile.lock
  - wiki/
