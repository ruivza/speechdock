# Modified by ruivza: remove the updater dependency and bundle license/attribution.
name: SpeechDock
options:
  bundleIdPrefix: com.speechdock
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  knownRegions: [en, ja, de, fr, ko, zh-Hans]

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settingGroups:
  signing:
    configs:
      Debug:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
      Release:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Developer ID Application

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: 0.2.1

targets:
  SpeechDock:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Utilities
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/SpeechDock.sdef
        buildPhase: resources
      - path: Resources/container-migration.plist
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ja.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
      - path: Resources/de.lproj
        buildPhase: resources
      - path: Resources/fr.lproj
        buildPhase: resources
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechdock.app
        PRODUCT_NAME: SpeechDock
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "0.2.0"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/SpeechDock.entitlements
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.speechdock.app.dev
          SPEECHDOCK_DISPLAY_NAME: "SpeechDock Dev"
        Release:
          SPEECHDOCK_DISPLAY_NAME: SpeechDock
    dependencies:
      - package: HotKey
      - target: SpeechDockVoiceInput
        embed: true
        link: false
        codeSign: false # Preserve the helper's own sandbox entitlements and signature.
        copy:
          destination: resources
          subpath: InputMethods

  SpeechDockVoiceInput:
    type: application
    platform: macOS
    sources:
      - path: InputMethod
        excludes: [Info.plist, VoiceInput.entitlements]
      - path: Resources/Assets.xcassets/MenuBarIcon.imageset/menubar.png
        buildPhase: resources
      - path: Services/InputMethod/VoiceInputSession.swift
      - path: Services/RealtimeSTT/RealtimeSTTProtocol.swift
      - path: Services/RealtimeSTT/OnDeviceSTTFactory.swift
      - path: Services/RealtimeSTT/MacOSRealtimeSTT.swift
      - path: Services/RealtimeSTT/SpeechAnalyzerSTT.swift
      - path: Services/AudioInputManager.swift
      - path: Services/AudioLevelMonitor.swift
      - path: Services/DebugLogger.swift
      - path: Models/LanguageCode.swift
      - path: Models/STTProvider.swift
      - path: Services/InterfaceLanguage.swift
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ja.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
      - path: Resources/de.lproj
        buildPhase: resources
      - path: Resources/fr.lproj
        buildPhase: resources
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechdock.inputmethod.voice
        PRODUCT_NAME: SpeechDockVoiceInput
        VOICE_INPUT_DISPLAY_NAME: SpeechDock Voice Input
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "0.2.0"
        INFOPLIST_FILE: InputMethod/Info.plist
        CODE_SIGN_ENTITLEMENTS: InputMethod/VoiceInput.entitlements
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.speechdock.inputmethod.voice.dev
          VOICE_INPUT_DISPLAY_NAME: SpeechDock Voice Input Dev
    dependencies:
      - sdk: InputMethodKit.framework

  SpeechDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechdock.app.tests
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpeechDock

schemes:
  SpeechDockVoiceInput:
    build:
      targets:
        SpeechDockVoiceInput: all
    run:
      config: Debug
    archive:
      config: Release
  SpeechDock:
    build:
      targets:
        SpeechDock: all
        SpeechDockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        SPEECHDOCK_TEST_NO_API_KEYS: "1"
      targets:
        - SpeechDockTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
